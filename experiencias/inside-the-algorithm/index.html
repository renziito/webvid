<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050509"><title>Inside the Algorithm — WebVid Preview</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;touch-action:none}body{display:grid;place-items:center}.film{width:min(100vw,56.25vh);height:min(100vh,177.7778vw);position:relative;overflow:hidden;background:#050509;isolation:isolate}.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .65s ease,visibility .65s;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#2b0715,#08050b 48%,#020205 80%)}.scene.active{opacity:1;visibility:visible}.scene:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(0deg,transparent 0 4px,#fff1 5px 6px);opacity:.11;pointer-events:none}.glow{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:#ed173b;filter:blur(90px);opacity:.32;left:15%;top:25%;animation:breathe 7s ease-in-out infinite alternate}.phone{position:absolute;width:47%;height:51%;left:26.5%;top:24%;border:7px solid #2d2932;border-radius:35px;background:linear-gradient(155deg,#310c22,#08060d 65%);box-shadow:0 0 90px #ff164b55,inset 0 0 40px #f13a5544;transform:perspective(900px) rotateY(-16deg) rotateX(7deg);animation:approach 11s ease-in-out infinite alternate}.phone:after{content:"";position:absolute;inset:9%;border-radius:20px;background:radial-gradient(circle at 50% 55%,#fa335b 0 5%,transparent 20%),repeating-linear-gradient(155deg,transparent 0 38px,#ff3b5a18 40px 44px)}.beam{position:absolute;left:50%;top:50%;width:2px;height:90%;transform-origin:top;background:linear-gradient(#ff517e,transparent);box-shadow:0 0 18px #ff235d;opacity:.65}.orbit{position:absolute;left:50%;top:50%;width:48%;aspect-ratio:1;border:1px solid #ff426b88;border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);box-shadow:0 0 35px #ff2e5733;animation:spin 12s linear infinite}.orb2{width:78%;animation-direction:reverse;animation-duration:18s}.node{position:absolute;width:13px;aspect-ratio:1;border-radius:50%;background:#ff4b70;box-shadow:0 0 23px #ff164e;animation:pulse 2.5s ease-in-out infinite alternate}.tile{position:absolute;width:43%;height:29%;border:1px solid #f45b7755;border-radius:19px;background:linear-gradient(145deg,#441129b0,#0c0712c9);box-shadow:0 0 45px #ff225522;transform:perspective(600px) rotateY(-15deg) rotateX(8deg);animation:float 7s ease-in-out infinite alternate}.tile:nth-of-type(3){left:7%;top:16%;opacity:.3;transform:scale(.75)}.tile:nth-of-type(4){right:8%;top:33%;border-color:#ff668a;box-shadow:0 0 85px #fa194b99;animation-delay:-2s}.tile:nth-of-type(5){left:12%;bottom:10%;opacity:.25;animation-delay:-4s}.river{position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 11deg,#ff325c38 12deg 13deg,transparent 14deg 22deg);filter:blur(3px);animation:spin 26s linear infinite}.ring{position:absolute;left:50%;top:50%;width:55%;aspect-ratio:1;border:15px solid #ff315a;border-left-color:#ff315a22;border-bottom-color:#ff315a22;border-radius:50%;transform:translate(-50%,-50%) rotate(-30deg);filter:drop-shadow(0 0 20px #e92256);animation:spin 8s linear infinite}.ring.small{width:29%;border-width:7px;animation-direction:reverse}.gridlight{position:absolute;inset:0;background:radial-gradient(circle at 20% 24%,#ff446c 0 4px,transparent 5px),radial-gradient(circle at 78% 31%,#ff446c 0 7px,transparent 8px),radial-gradient(circle at 38% 70%,#ff446c 0 5px,transparent 6px),radial-gradient(circle at 83% 79%,#ff446c 0 3px,transparent 4px);filter:drop-shadow(0 0 12px #ff2d5b);animation:breathe 6s infinite alternate}.strand{position:absolute;width:120%;height:2px;left:-10%;top:50%;background:linear-gradient(90deg,transparent,#ff5079,transparent);box-shadow:0 0 25px #ff2c59;transform:rotate(-25deg);animation:float 7s infinite alternate}.strand:nth-child(4){transform:rotate(37deg);top:35%}.strand:nth-child(5){transform:rotate(75deg);top:62%}.spark{position:absolute;left:50%;top:47%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff3f5;box-shadow:0 0 30px #fff,0 0 90px 40px #ff315f,0 0 180px 90px #e10b4333;animation:breathe 5s infinite alternate}.halo{position:absolute;left:50%;top:47%;width:50%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #ff8ba4aa;border-radius:50%;box-shadow:0 0 55px #ff235b88;animation:expand 6s infinite}.halo:nth-of-type(3){animation-delay:-3s}.scene.active .moving{animation-play-state:running}@keyframes breathe{to{opacity:.75;scale:1.16}}@keyframes approach{to{transform:perspective(900px) rotateY(12deg) rotateX(-4deg) scale(1.12)}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes pulse{to{opacity:.25;scale:1.5}}@keyframes float{to{translate:0 -8%;opacity:.85}}@keyframes expand{0%{scale:.65;opacity:0}50%{opacity:1}100%{scale:1.7;opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:20s!important;transition-duration:.1s!important}}
</style></head><body><main class="film" aria-label="Silent visual film preview. Swipe up or down to change scene."><section class="scene active" aria-label="Scene 1"><div class="glow"></div><div class="phone"></div></section><section class="scene" aria-label="Scene 2"><div class="glow"></div><div class="river"></div><div class="orbit"></div><div class="orbit orb2"></div><div class="node" style="left:24%;top:30%"></div><div class="node" style="left:70%;top:38%"></div><div class="node" style="left:41%;top:69%"></div></section><section class="scene" aria-label="Scene 3"><div class="glow"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></section><section class="scene" aria-label="Scene 4"><div class="glow"></div><div class="ring"></div><div class="ring small"></div></section><section class="scene" aria-label="Scene 5"><div class="glow"></div><div class="gridlight"></div><div class="strand"></div><div class="strand"></div><div class="strand"></div></section><section class="scene" aria-label="Scene 6"><div class="glow"></div><div class="spark"></div><div class="halo"></div><div class="halo"></div></section></main><script>
(()=>{'use strict';const scenes=[...document.querySelectorAll('.scene')];let current=0,startY=null,locked=false;function change(delta){if(locked)return;const next=Math.max(0,Math.min(scenes.length-1,current+delta));if(next===current)return;locked=true;scenes[current].classList.remove('active');scenes[next].classList.add('active');current=next;setTimeout(()=>locked=false,700)}addEventListener('touchstart',e=>{if(e.touches.length===1)startY=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{if(startY===null)return;const diff=e.changedTouches[0].clientY-startY;startY=null;if(Math.abs(diff)>45)change(diff<0?1:-1)},{passive:true});addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>25)change(e.deltaY>0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='PageDown')change(1);if(e.key==='ArrowDown'||e.key==='PageUp')change(-1)});})();
</script></body></html>
