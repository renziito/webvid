<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>WebVid Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090d;color:#f4f0e8;font-family:system-ui,-apple-system,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 35%,#25202a 0%,#101116 42%,#08090d 78%)}
    main{width:min(100%,720px);text-align:center;padding:48px 20px}
    .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#c5a879}
    h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(58px,13vw,112px);letter-spacing:-.065em;line-height:.9;margin:26px 0}
    p{max-width:420px;margin:0 auto;color:#aaa6a1;line-height:1.8;font-size:15px}
    .rule{width:54px;height:1px;background:#b99a6b;margin:30px auto}
    footer{margin-top:56px;color:#66616a;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Experiencias visuales</div>
    <h1>WebVid<br>Studio</h1>
    <div class="rule"></div>
    <p>Historias diseñadas para sentirse como cine. Este espacio será el punto de entrada a tus experiencias verticales.</p>
    <footer>Un proyecto de Renziito</footer>
  </main>
</body>
</html>
