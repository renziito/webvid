name: Validate and deploy WebVid

on:
  push:
    branches: ["main", "fix/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "webvid-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WebVid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download and verify Lima photo assets
        if: github.ref == 'refs/heads/feature/lima-lluvia-final-sources'
        run: |
          python - <<'PY'
          import json
          import mimetypes
          import pathlib
          import time
          import urllib.error
          import urllib.request

          manifest = pathlib.Path("experiencias/lima-bajo-la-lluvia/assets/sources.json")
          assets_dir = manifest.parent
          assets_dir.mkdir(parents=True, exist_ok=True)
          data = json.loads(manifest.read_text(encoding="utf-8"))
          successes, failures = [], []

          signatures = {
              bytes.fromhex("ffd8ff"): ".jpg",
              bytes.fromhex("89504e470d0a1a0a"): ".png",
              b"GIF87a": ".gif",
              b"GIF89a": ".gif",
              b"RIFF": ".webp",
          }

          for item in data.get("image_assets", []):
              asset_id = item["id"]
              url = item["url"]
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; WebVidAssetFetcher/1.0)",
                      "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      payload = response.read(15 * 1024 * 1024 + 1)
                      content_type = response.headers.get("Content-Type", "").split(";")[0].lower()
                  if len(payload) < 512:
                      raise ValueError(f"respuesta demasiado pequeña: {len(payload)} bytes")
                  if len(payload) > 15 * 1024 * 1024:
                      raise ValueError("supera el límite de 15 MB")
                  extension = None
                  for signature, ext in signatures.items():
                      if payload.startswith(signature):
                          extension = ext
                          break
                  if payload.startswith(b"RIFF") and payload[8:12] == b"WEBP":
                      extension = ".webp"
                  if not extension:
                      raise ValueError(f"contenido no reconocido como imagen (Content-Type: {content_type})")
                  filename = f"{asset_id.lower()}{extension}"
                  target = assets_dir / filename
                  target.write_bytes(payload)
                  successes.append({
                      "id": asset_id,
                      "file": filename,
                      "bytes": len(payload),
                      "source": url,
                  })
                  print(f"OK {asset_id}: {filename} ({len(payload)} bytes)")
              except Exception as exc:
                  failures.append({"id": asset_id, "url": url, "error": str(exc)})
                  print(f"ERROR {asset_id}: {exc}")
              time.sleep(0.25)

          report = {
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "downloaded": successes,
              "failed": failures,
              "summary": {"requested": len(data.get("image_assets", [])),
                          "downloaded": len(successes), "failed": len(failures)},
          }
          (assets_dir / "download-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print(f"Resumen: {len(successes)} descargadas; {len(failures)} fallidas.")
          if not successes:
              raise SystemExit("No se pudo descargar ninguna imagen; no se crearán assets vacíos.")
          PY

      - name: Commit downloaded assets to review branch
        if: github.ref == 'refs/heads/feature/lima-lluvia-final-sources'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiencias/lima-bajo-la-lluvia/assets/
          if git diff --cached --quiet; then
            echo "No hay assets nuevos que guardar."
          else
            git commit -m "assets(lima-bajo-la-lluvia): download and verify source photos"
            git push origin HEAD:feature/lima-lluvia-final-sources
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node --check scripts/validate-catalog.mjs
          node --check studio/studio.mjs
          node --check studio/mobile-export.mjs
          node --check studio/dom-renderer.mjs
          node --check studio/audio-analyzer.mjs
          node --check studio/exporter.mjs
          node --check studio/render.mjs
          node --check experiencias/inside-the-algorithm/script.js
          node --check experiencias/lima-bajo-la-lluvia/script.js
          node --check engine/scene-engine.mjs
          node --check engine/virtual-camera-engine.mjs
          node --check engine/gesture-controller.mjs
          node --check engine/scene-player.mjs
          node --check engine/transition-engine.mjs
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Validate experience catalog and resources
        run: node scripts/validate-catalog.mjs
      - name: Assemble public site artifact
        run: |
          set -euo pipefail
          for file in index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg experiencias.json engine/scene-engine.mjs engine/virtual-camera-engine.mjs engine/gesture-controller.mjs engine/scene-player.mjs engine/scene-player.css engine/transition-engine.mjs studio/index.html studio/studio.css studio/studio.mjs studio/mobile-export.mjs studio/dom-renderer.mjs studio/audio-analyzer.mjs studio/exporter.mjs studio/render.html studio/render.css studio/render.mjs; do
            test -f "$file"
          done
          rm -rf dist
          mkdir -p dist/experiencias dist/engine dist/studio
          cp index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg experiencias.json dist/
          cp engine/scene-engine.mjs engine/virtual-camera-engine.mjs engine/gesture-controller.mjs engine/scene-player.mjs engine/scene-player.css engine/transition-engine.mjs dist/engine/
          cp studio/index.html studio/studio.css studio/studio.mjs studio/mobile-export.mjs studio/dom-renderer.mjs studio/audio-analyzer.mjs studio/exporter.mjs studio/render.html studio/render.css studio/render.mjs dist/studio/
          if [ -d experiencias ]; then cp -R experiencias/. dist/experiencias/; fi
          rm -f dist/experiencias/.gitkeep
          touch dist/.nojekyll
          if find dist -type f \( -name "*.md" -o -name "*.txt" -o -name "*.pdf" -o -name "*.doc" -o -name "*.docx" \) | grep -q .; then
            echo "Unexpected documentation file in public artifact."
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    name: Deploy production site
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
