name: Deploy WebVid to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node --check scripts/validate-catalog.mjs
          node --check engine/scene-engine.mjs

      - name: Run automated tests
        run: node --test tests/*.test.mjs

      - name: Validate experience catalog and resources
        run: node scripts/validate-catalog.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Assemble public site
        run: |
          set -euo pipefail
          for file in index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg experiencias.json engine/scene-engine.mjs; do
            test -f "$file"
          done

          rm -rf dist
          mkdir -p dist/experiencias dist/engine
          cp index.html manifest.webmanifest sw.js icon.svg icon-maskable.svg experiencias.json dist/
          cp engine/scene-engine.mjs dist/engine/

          if [ -d experiencias ]; then
            cp -R experiencias/. dist/experiencias/
          fi

          rm -f dist/experiencias/.gitkeep
          touch dist/.nojekyll

          if find dist -type f \( -name "*.md" -o -name "*.txt" -o -name "*.pdf" -o -name "*.doc" -o -name "*.docx" \) | grep -q .; then
            echo "Unexpected documentation file in public artifact."
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
