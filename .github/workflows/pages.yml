name: Deploy WebVid to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate experience catalog
        run: node scripts/validate-catalog.mjs

      - name: Assemble public site (exclude scripts and project documentation)
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          test -f experiencias.json

          mkdir -p dist/experiencias
          cp index.html manifest.webmanifest sw.js icon.svg experiencias.json dist/

          if [ -d experiencias ]; then
            cp -R experiencias/. dist/experiencias/
          fi

          rm -f dist/experiencias/.gitkeep
          touch dist/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
